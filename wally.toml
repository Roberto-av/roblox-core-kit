[package]
name = "roberto-av/roblox-core-kit"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
description = "UI multiplataforma, navegación por gamepad y debug extensible con Iris"
license = "MIT"
authors = ["Roberto-av"]
exclude = ["example/**", "scripts/**", "docs/PLAN.md", "docs/general_especifications.md", "dev.project.json", "rokit.toml", "selene.toml", "stylua.toml", "sourcemap.json", "*.rbxl", "*.rbxm", "*.lock"]
include = ["src", "src/**", "default.project.json", "wally.toml", "README.md", "LICENSE"]

[dependencies]
Iris = "sirmallard/iris@^2"
Signal = "sleitnick/signal@^2.0.1"
